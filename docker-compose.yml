# Basis bersama untuk container PHP non-web (queue & scheduler): image, kode, env, dan network sama dengan app.
# image diset ke tag bawaan service app (<project>-app) agar build menghasilkan image yang SAMA, bukan image kedua.
x-app-base: &app-base
  image: ${COMPOSE_PROJECT_NAME}-app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  restart: unless-stopped
  working_dir: /var/www/html
  volumes:
    - ./:/var/www/html
    - app_vendor:/var/www/html/vendor
    - ./docker/php/zz-tuning.ini:/usr/local/etc/php/conf.d/zz-tuning.ini:ro
  environment:
    - APP_ENV=local
    - APP_DEBUG=false
    - TZ=Asia/Jakarta
  networks:
    - simrslog-net
  depends_on:
    - postgres
    - redis

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: simrslogv2-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - app_vendor:/var/www/html/vendor
      - app_node_modules:/var/www/html/node_modules
      # Compiled Blade views di named volume (hindari stat lambat bind-mount Windows).
      # Setelah start pertama: docker exec -u root simrslogv2-app chown -R www-data:www-data /var/www/html/storage/framework/views
      - app_storage_views:/var/www/html/storage/framework/views
      - ./docker/php/zz-tuning.ini:/usr/local/etc/php/conf.d/zz-tuning.ini:ro
    ports:
      - "5173:5173"
    environment:
      - APP_ENV=local
      - APP_DEBUG=false
      - TZ=Asia/Jakarta
    networks:
      - simrslog-net
    depends_on:
      - postgres
      - redis

  # Worker antrean redis 'default' (push FCM dll). Restart otomatis; --max-time membuat worker
  # keluar tiap jam lalu dihidupkan ulang Docker agar memori & kode terbaru ikut termuat.
  queue:
    <<: *app-base
    container_name: simrslogv2-queue
    command: php artisan queue:work redis --queue=default --tries=3 --sleep=3 --max-time=3600 --memory=192

  # Penjalan jadwal Laravel (cron 00:01, 01:00, 06:00, 07:00) via schedule:work. Restart otomatis.
  scheduler:
    <<: *app-base
    container_name: simrslogv2-scheduler
    command: php artisan schedule:work

  web:
    image: nginx:alpine
    container_name: simrslogv2-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - simrslog-net
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: simrslogv2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: simlog_rs
      POSTGRES_USER: simlog_user
      POSTGRES_PASSWORD: simlog_pass
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - simrslog-net

  redis:
    image: redis:7-alpine
    container_name: simrslogv2-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - simrslog-net

networks:
  simrslog-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_vendor:
    driver: local
  app_node_modules:
    driver: local
  app_storage_views:
    driver: local
