services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: simrslogv2-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - app_vendor:/var/www/html/vendor
      - app_node_modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - TZ=Asia/Jakarta
    networks:
      - simrslog-net
    depends_on:
      - postgres
      - redis

  web:
    image: nginx:alpine
    container_name: simrslogv2-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - simrslog-net
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: simrslogv2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: simlog_rs
      POSTGRES_USER: simlog_user
      POSTGRES_PASSWORD: simlog_pass
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - simrslog-net

  redis:
    image: redis:7-alpine
    container_name: simrslogv2-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - simrslog-net

networks:
  simrslog-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_vendor:
    driver: local
  app_node_modules:
    driver: local
